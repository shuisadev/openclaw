name: 193958 proof - CLI scheduler add suppresses false reminder note

on:
  workflow_dispatch:
  push:
    branches:
      - proof/193958

permissions:
  contents: read

concurrency:
  group: 193958-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    name: Real claude CLI turn through the Gateway MCP loopback
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "true"
          install-deps: "true"
          frozen-lockfile: "true"

      - name: Run real CLI path proof
        env:
          NO_COLOR: "1"
          OPENCLAW_193958_DIAG: "1"
        run: |
          set -euo pipefail
          {
            echo "### node $(node --version)"
            echo "### head: $(git rev-parse HEAD)"
          } | tee proof.log
          set +e
          export OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS=900000
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.gateway-server-isolated.config.ts \
            src/gateway/cli-scheduler-add-proof.test.ts \
            2>&1 | tee -a proof.log
          status=${PIPESTATUS[0]}
          echo "--- proof evidence ---" | tee -a proof.log
          cat proof-evidence-scheduled.txt 2>/dev/null | tee -a proof.log || echo "(no scheduled evidence)"
          cat proof-evidence-control.txt 2>/dev/null | tee -a proof.log || echo "(no control evidence)"
          echo "--- guard diagnostics ---" | tee -a proof.log
          { grep -a -e "\[guard-diag\]" -e "\[deliver-diag\]" proof.log || true; } > guard-diag.txt
          cat guard-diag.txt | tee -a proof.log
          echo "--- payload assertions ---" | tee -a proof.log
          segmented=$(awk '/\[proof-turn\]/{turn=$0} /\[guard-diag\]/{print turn" :: "$0}' proof.log)
          echo "$segmented" | tee -a proof.log
          if echo "$segmented" | grep -q "scheduled :: .*append-called"; then
            echo "FAIL scheduled: the guard appended the note even though the counter recorded the add" | tee -a proof.log
            exit 1
          fi
          if ! echo "$segmented" | grep -q "control :: .*appended-text=.*I did not schedule a reminder"; then
            echo "FAIL control: the guard did not put the note on the reply payload" | tee -a proof.log
            exit 1
          fi
          if echo "$segmented" | grep -q "matched=true"; then
            echo "FAIL: an existing cron job covered this session, so the run cannot discriminate the counter" | tee -a proof.log
            exit 1
          fi
          echo "OK scheduled payload carried no note; control payload carried it; existing-cron coverage stayed false" | tee -a proof.log
          echo "--- agent events ---" | tee -a proof.log
          cat proof-agent-events.txt 2>/dev/null | tee -a proof.log || echo "(no agent events)"
          exit $status

      - name: Upload proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 193958-proof-log
          path: |
            proof.log
            guard-diag.txt
          retention-days: 14
